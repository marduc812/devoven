name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# There is no lint step: Next 16 removed `next lint` and ESLint went with it,
# so `npm run build` is the type check.

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - run: npm ci

      # Include build and test dependencies. The documented deepmerge advisory
      # is low severity; moderate or higher advisories must fail this job.
      - run: npm audit --audit-level=moderate
