name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# There is no lint step: Next 16 removed `next lint` and ESLint went with it,
# so `npm run build` is the type check.

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: a new advisory against a shipped dependency should be visible
    # without blocking every unrelated pull request.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high
